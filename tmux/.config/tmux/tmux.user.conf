##### KEYBINDINGS #####
# Prefix (C-Space/C-b), splits (h/v), resize (Ctrl+Alt+Shift+Arrow), and
# zoom (prefix+z) are all left on tmux/Omarchy's own defaults now — trying
# them instead of the old screen-style C-a/|/-/hjkl/m habits. prefix+r used
# to reload config here, which silently clobbered Omarchy's own prefix+r
# (rename window); reload is prefix+q there, so that bind is gone too.
#
# Copy-mode y is also gone: Omarchy's tmux.conf already has `set-clipboard
# on` + `terminal-features ",*:clipboard"` (OSC 52), so the plain default
# already forwards yanks to the system clipboard through the terminal —
# verified live. A custom wl-copy/pbcopy pipe was solving an already-solved
# problem. Only open question is whether OSC 52 is enabled in whatever
# terminal this same config runs under on the Mac; if not, this may need
# reinstating there.

##### PLUGINS #####
# Dropped tmux-resurrect/tmux-continuum (session persistence) — nice, but
# not critical enough to keep as a customization.
#
# Also trying life without vim-tmux-navigator: Ctrl+Alt+Arrow (Omarchy,
# no prefix) moves between tmux panes; Ctrl+w then h/j/k/l (vanilla vim)
# moves between splits inside one nvim. TPM stays installed in case this
# doesn't stick.
set -g @plugin 'tmux-plugins/tpm'

run '~/.config/tmux/plugins/tpm/tpm'
