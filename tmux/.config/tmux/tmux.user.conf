# User override, sourced after tmux.omarchy.conf (see tmux.conf).
#
# Omarchy hijacks Ctrl-Space as the primary prefix (tmux.omarchy.conf:2-4),
# which is also the conventional nvim-cmp completion-trigger key — tmux was
# eating it before nvim ever saw it. Free it up and fall back to tmux's own
# traditional default, C-b (already prefix2 upstream), as the sole prefix.
set -g prefix C-b
unbind C-Space
