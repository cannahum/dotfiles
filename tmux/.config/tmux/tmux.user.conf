##### KEYBINDINGS #####
# Prefix (C-Space/C-b), splits (h/v), and resize (Ctrl+Alt+Shift+Arrow) are
# left on Omarchy's own defaults now — trying them instead of the old
# screen-style C-a/|/-/hjkl habits. prefix+r used to reload config here,
# which silently clobbered Omarchy's own prefix+r (rename window); reload
# is prefix+q there, so this bind is gone rather than fixed.
bind -r m resize-pane -Z

##### COPY MODE #####
# Omarchy's y only copies to tmux's internal buffer. Route it to the real
# OS clipboard instead — no Omarchy equivalent for this.
unbind -T copy-mode-vi y
bind -T copy-mode-vi y send -X copy-pipe-and-cancel \
  'sh -c "if command -v wl-copy >/dev/null; then wl-copy; \
          elif command -v pbcopy >/dev/null; then pbcopy; \
          else cat >/dev/null; fi"'

##### PLUGINS #####
# Dropped tmux-resurrect/tmux-continuum (session persistence) — nice, but
# not critical enough to keep as a customization.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.config/tmux/plugins/tpm/tpm'
