##### Terminal / colors #####
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"     # truecolor in modern tmux

##### General UX #####
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0                 # instant ESC for Neovim
setw -g mode-keys vi

##### Prefix #####
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

##### Splits / reload / zoom #####
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind -r m resize-pane -Z

##### Resize with vim-style keys (with prefix) #####
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

##### Clipboard (Kitty OSC52 + platform fallbacks on 'y') #####
set -g set-clipboard on
unbind -T copy-mode-vi y
bind   -T copy-mode-vi y send -X copy-pipe-and-cancel \
  'sh -c "if command -v wl-copy >/dev/null; then wl-copy; \
          elif command -v pbcopy >/dev/null; then pbcopy; \
          elif command -v clip.exe >/dev/null; then clip.exe; \
          else cat >/dev/null; fi"'
bind   -T copy-mode-vi v send -X begin-selection

##### Plugins (TPM) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Toggle between Day (light) and Night (dark)
bind L run-shell '
  current=$(tmux show -gqv status-style);
  if echo "$current" | grep -q "#181825"; then
    # currently dark → switch to light
    tmux set -g status-style "bg=#eff1f5,fg=#4c4f69";
    tmux display-message "Theme: Day (light)";
  else
    # currently light → switch to dark
    tmux set -g status-style "bg=#181825,fg=#cdd6f4";
    tmux display-message "Theme: Night (dark)";
  fi
'

# Resurrect
set -g @resurrect-save 'on'
set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-debug 'off'

# TPM bootstrap (keep last)
run '~/.tmux/plugins/tpm/tpm'

