##### Terminal / colors #####
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"     # truecolor in modern tmux

##### General UX #####
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0                 # instant ESC for Neovim
setw -g mode-keys vi

##### Prefix #####
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

##### Splits / reload / zoom #####
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind -r m resize-pane -Z

##### Resize with vim-style keys (with prefix) #####
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

##### Clipboard (Kitty OSC52 + platform fallbacks on 'y') #####
set -g set-clipboard on
unbind -T copy-mode-vi y
bind   -T copy-mode-vi y send -X copy-pipe-and-cancel \
  'sh -c "if command -v wl-copy >/dev/null; then wl-copy; \
          elif command -v pbcopy >/dev/null; then pbcopy; \
          elif command -v clip.exe >/dev/null; then clip.exe; \
          else cat >/dev/null; fi"'
bind   -T copy-mode-vi v send -X begin-selection

##### Statusline (minimal to avoid clashing with Omarchy themes) #####
set -g status on
set -g status-interval 2
set -g status-style bg=default,fg=colour250
set -g status-left-length 40
set -g status-right-length 120
set -g status-left  "#[bold]#S "
set -g status-right "#(date +'%a %H:%M') "

##### Plugins (TPM) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Resurrect
set -g @resurrect-save 'on'
set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-debug 'off'

# TPM bootstrap (keep last)
run '~/.tmux/plugins/tpm/tpm'

