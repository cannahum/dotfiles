# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane
#
# Keybindings are intentionally left mostly unset here — herdr's own built-in
# defaults apply (prefix=ctrl+b, prefix+h/j/k/l pane focus, prefix+v/prefix+minus
# splits, etc). Run `herdr --default-config` to see them all, or restore the
# full [keys] section from /usr/share/omarchy/config/herdr/config.toml if the
# tmux-mirrored keymap is ever wanted back wholesale.
#
# Any binding added below is a deliberate carve-out for an action herdr ships
# unbound by default, not a personal choice — pull the value straight from
# /usr/share/omarchy/config/herdr/config.toml so a partial extension still
# lands exactly where Omarchy's full keymap would have put it.

[keys]
# Unbound by default; without it there is no keyboard-only way to select and
# copy scrollback text (mouse-select still auto-copies via copy_on_select).
copy_mode = "prefix+["

# Unbound by default; toggles back to the last-focused pane (tmux's last-active-pane).
last_pane = "prefix+;"

# Unbound by default; matches tmux's resize-pane on C-M-S-arrows without entering resize mode.
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# Unbound by default; matches tmux's swap-window -t -1/+1 on M-S-Left/Right.
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Unbound by default; keyboard-only session switching.
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
