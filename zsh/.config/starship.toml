# Starts from Omarchy's own stock starship.toml (plain text, single line,
# no powerline arrows/blocks) -- that structure was fine. What wasn't fine
# was the color: stock hardcodes "cyan" everywhere regardless of theme.
# These hex values are pulled from the current Omarchy theme's own generated
# palette (~/.local/state/omarchy/current/theme/colors.toml: accent, green,
# red) -- not synced live (Omarchy doesn't theme-sync starship either, no
# omarchy-theme-set-starship script exists), just seeded from it once.
add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

palette = "ristretto"

[palettes.ristretto]
accent = "#f38d70"
clean = "#adda78"
dirty = "#fd6883"

[character]
error_symbol = "[✗](bold dirty)"
success_symbol = "[❯](bold accent)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "accent"
repo_root_style = "bold accent"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic accent"

[git_status]
format     = '[$all_status]($style)'
style      = "dirty"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = "[](bold clean)"
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
